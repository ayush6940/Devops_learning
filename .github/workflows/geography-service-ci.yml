name: Geography Service CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'geography-service/**'
      - '.github/workflows/geography-service-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'geography-service/**'
      - '.github/workflows/geography-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./geography-service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and verify with Maven
      run: mvn clean verify
