name: Docker CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build
        run: |
          cd geography-service && mvn clean install -DskipTests
          cd ../mood-board-service && mvn clean install -DskipTests

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build geography image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/geography-service:latest \
          ./geography-service

      - name: Push geography image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/geography-service:latest

      - name: Build moodboard image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/mood-board-service:latest \
          ./mood-board-service

      - name: Push moodboard image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mood-board-service:latest
